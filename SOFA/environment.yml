# Conda environment for the SOFA demo:  conda env create -f SOFA/environment.yml
# (scripts/setup.sh does this). From conda we take Python 3.12 and OpenBLAS – the SOFA v26.06 binary
# is linked against libpython3.12.so.1.0, which systems with a newer Python do not have.
# Python packages come from pip (requirements.txt), so the versions are identical on every system.
name: fishsofa
channels:
  - conda-forge
dependencies:
  - python=3.12
  # BLAS/LAPACK for CHOLMOD (scripts/env.sh): OpenBLAS from conda, independent of the system.
  # The system BLAS is sometimes the reference, unoptimized one (Arch: 2.2× slower step).
  - libblas=*=*openblas
  - liblapack=*=*openblas
  - pip
  - pip:
      - -r requirements.txt
