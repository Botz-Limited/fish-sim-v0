<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="1600" height="600" font-family="DejaVu Sans, Arial, sans-serif">
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#142029"/></marker>
<marker id="w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b8741a"/></marker>
<style>
.box{fill:#fff;stroke:#142029;stroke-width:1.4} .soft{fill:#e2f0f3;stroke:#0a6a84;stroke-width:1.4}
.ln{fill:none;stroke:#142029;stroke-width:1.6} .dash{fill:none;stroke:#b8741a;stroke-width:1.6;stroke-dasharray:6 4}
.t{fill:#142029;font-size:12px} .b{fill:#142029;font-size:13px;font-weight:600} .m{fill:#56646e;font-size:11.5px} .w{fill:#b8741a;font-size:11.5px}
