[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fishsim"
version = "0.1.0"
description = "Edukacyjne demo MuJoCo: robot-ryba z hydraulicznym ogonem i balastem"
requires-python = ">=3.10"
dependencies = ["mujoco>=3.3.1", "numpy", "matplotlib"]

[tool.setuptools]
packages = ["fishsim"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
